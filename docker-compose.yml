services:
  postgres:
    image: postgres:16-alpine
    container_name: imran-portfolio-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: imran_portfolio
    volumes:
      - imran_portfolio_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    image: imran-portfolio:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: imran-portfolio-web
    restart: unless-stopped
    ports:
      - "4321:4321"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/imran_portfolio
      AUTH_SECRET: ${AUTH_SECRET:-dev-only-change-me}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  imran_portfolio_pg:
